<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How WebMeld works</title>
  <desc id="desc">Select a live element, describe the change, preview and verify the CSS, then save locally or roll back.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f1efff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8067f8"/>
      <stop offset="1" stop-color="#4a32b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#271b65" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7657f6"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="32" fill="url(#background)"/>
  <circle cx="1080" cy="76" r="118" fill="#7657f6" opacity=".055"/>
  <circle cx="90" cy="650" r="154" fill="#4a32b8" opacity=".045"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="74" y="72" fill="#7657f6" font-size="16" font-weight="800" letter-spacing="2.4">WEBMELD WORKFLOW</text>
    <text x="74" y="116" fill="#171a24" font-size="34" font-weight="750" letter-spacing="-1.1">From intent to a verified page change</text>

    <path d="M534 258H653" fill="none" stroke="#7657f6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M896 358V411" fill="none" stroke="#7657f6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M666 536H547" fill="none" stroke="#7657f6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="74" y="168" width="460" height="190" rx="24" fill="#fff"/>
      <rect x="666" y="168" width="460" height="190" rx="24" fill="#fff"/>
      <rect x="666" y="424" width="460" height="190" rx="24" fill="#fff"/>
      <rect x="74" y="424" width="460" height="190" rx="24" fill="#fff"/>
    </g>

    <g>
      <rect x="102" y="196" width="50" height="50" rx="15" fill="url(#brand)"/>
      <path d="m116 221 8 8 17-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="213" fill="#7657f6" font-size="14" font-weight="800" letter-spacing="1.4">01 · SELECT</text>
      <text x="170" y="243" fill="#171a24" font-size="24" font-weight="720">Pick a live DOM element</text>
      <text x="102" y="288" fill="#626b7d" font-size="17">See its selector, dimensions, text, and</text>
      <text x="102" y="316" fill="#626b7d" font-size="17">HTML context before making a request.</text>
    </g>

    <g>
      <rect x="694" y="196" width="50" height="50" rx="15" fill="url(#brand)"/>
      <path d="M708 231h22M708 220h16M708 209h22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="762" y="213" fill="#7657f6" font-size="14" font-weight="800" letter-spacing="1.4">02 · DESCRIBE</text>
      <text x="762" y="243" fill="#171a24" font-size="24" font-weight="720">Say what should change</text>
      <text x="694" y="288" fill="#626b7d" font-size="17">Use plain language with local rules or your</text>
      <text x="694" y="316" fill="#626b7d" font-size="17">own OpenAI-compatible model.</text>
    </g>

    <g>
      <rect x="694" y="452" width="50" height="50" rx="15" fill="url(#brand)"/>
      <path d="M706 477h9l7-12 8 24 7-12h7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="762" y="469" fill="#7657f6" font-size="14" font-weight="800" letter-spacing="1.4">03 · VERIFY</text>
      <text x="762" y="499" fill="#171a24" font-size="24" font-weight="720">Preview against the real page</text>
      <text x="694" y="544" fill="#626b7d" font-size="17">Sanitize declarations, compare computed</text>
      <text x="694" y="572" fill="#626b7d" font-size="17">styles, and verify directional intent.</text>
    </g>

    <g>
      <rect x="102" y="452" width="50" height="50" rx="15" fill="url(#brand)"/>
      <path d="M114 465h26v23h-26zM120 465v9h14v-9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="469" fill="#7657f6" font-size="14" font-weight="800" letter-spacing="1.4">04 · DECIDE</text>
      <text x="170" y="499" fill="#171a24" font-size="24" font-weight="720">Keep it—or roll it back</text>
      <rect x="102" y="530" width="178" height="38" rx="19" fill="#e9f8f0"/>
      <circle cx="123" cy="549" r="6" fill="#2da36d"/>
      <text x="138" y="555" fill="#257b55" font-size="15" font-weight="700">Approve · save</text>
      <rect x="292" y="530" width="196" height="38" rx="19" fill="#f2efff"/>
      <circle cx="313" cy="549" r="6" fill="#7657f6"/>
      <text x="328" y="555" fill="#5b45ca" font-size="15" font-weight="700">Reject · rollback</text>
    </g>
  </g>
</svg>
