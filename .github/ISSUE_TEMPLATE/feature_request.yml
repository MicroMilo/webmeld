name: Product idea
description: Propose a focused improvement or new workflow.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the moment and the user, not only the feature.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What do you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should WebMeld do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Does this change page access, model data, permissions, or persistence?
      placeholder: No / Yes — explain
    validations:
      required: true
